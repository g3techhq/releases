name: Publish

# Called by an app's own release workflow, after its build jobs have uploaded
# their files as artifacts of the same run:
#
#   publish:
#     needs: [android, windows]
#     uses: g3techhq/releases/.github/workflows/publish.yml@main
#     with:
#       app: skicut
#       version: "0.2.0"
#       artifacts: release-*
#       files: |
#         android=SnowCut_0.2.0.apk
#         windows-x86_64-nsis=SnowCut_0.2.0_x64-setup.zip
#       attach: SnowCut_0.2.0_x64-setup.exe
#       key_file: src/updater.rs
#     secrets:
#       updater_key: ${{ secrets.UPDATER_KEY }}
#       releases_token: ${{ secrets.RELEASES_TOKEN }}
#
# It signs each file, publishes them as the release `<app>-v<version>` of
# this repository, and only then writes `apps/<app>/<channel>.json`, the file
# installed apps check. See README.md.

on:
  workflow_call:
    inputs:
      app:
        description: The app's name in this repository (lowercase, digits, hyphens)
        required: true
        type: string
      version:
        description: The version being released, as semver
        required: true
        type: string
      artifacts:
        description: Pattern of the calling run's artifacts that hold the files
        required: false
        type: string
        default: ""
      files:
        description: Files to sign and attach, one `platform=file name` per line
        required: false
        type: string
        default: ""
      attach:
        description: Other files for the release page (a first-time installer), one name per line; not in the release file, not signed
        required: false
        type: string
        default: ""
      stores:
        description: Store pages to list, one `platform-store=url` per line
        required: false
        type: string
        default: ""
      channel:
        description: Which release file to write, apps/<app>/<channel>.json
        required: false
        type: string
        default: latest
      notes:
        description: Release notes, for the release page and the app
        required: false
        type: string
        default: ""
      key_file:
        description: A file in the calling repository holding the app's public key, checked against updater_key
        required: false
        type: string
        default: ""
    secrets:
      updater_key:
        description: The app's release key (scripts/release-signing.mjs keygen). Needed when there are files
        required: false
      releases_token:
        description: A token that can push to g3techhq/releases and create its releases
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.app }} ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      FILES: ${{ inputs.files }}
      ATTACH: ${{ inputs.attach }}
      STORES: ${{ inputs.stores }}
      NOTES: ${{ inputs.notes }}
      KEY_FILE: ${{ inputs.key_file }}
      RELEASES: g3techhq/releases

    steps:
      - name: Check out the releases repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: g3techhq/releases
          ref: main
          path: releases
          token: ${{ secrets.releases_token }}

      - name: Check the inputs
        env:
          UPDATER_KEY: ${{ secrets.updater_key }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "app must be lowercase letters, digits and hyphens: $APP" >&2; exit 1; }
          [[ "$CHANNEL" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "channel must be lowercase letters, digits and hyphens: $CHANNEL" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] || { echo "version is not semver: $VERSION" >&2; exit 1; }
          if [[ -n "${FILES//[[:space:]]/}" ]]; then
            : "${UPDATER_KEY:?Pass updater_key: files are signed with it}"
          fi
          [[ -n "${FILES//[[:space:]]/}${STORES//[[:space:]]/}" ]] || { echo "Pass files, stores, or both" >&2; exit 1; }

      # An app refuses every file signed by another key, so a mismatch would
      # publish a release no install can take.
      - name: Check out the app's key file
        if: inputs.key_file != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
          sparse-checkout: ${{ inputs.key_file }}
          sparse-checkout-cone-mode: false

      - name: Match the signing key to the app
        if: inputs.key_file != ''
        env:
          UPDATER_KEY: ${{ secrets.updater_key }}
        shell: bash
        run: |
          set -euo pipefail
          key="$(node releases/scripts/release-signing.mjs public-key | sed -n 2p)"
          grep -qF "$key" "app/$KEY_FILE" || {
            echo "updater_key does not belong to the public key in $KEY_FILE" >&2
            exit 1
          }

      - name: Download the files
        if: inputs.artifacts != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifacts }}
          path: dist
          merge-multiple: true

      - name: Sign the files
        if: inputs.files != ''
        env:
          UPDATER_KEY: ${{ secrets.updater_key }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line//[[:space:]]/}" ]] && continue
            file="${line#*=}"
            # GitHub renames an asset with other characters, breaking its URL.
            [[ "$file" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "$file: use only letters, digits, dots, hyphens and underscores" >&2; exit 1; }
            [[ -f "dist/$file" ]] || { echo "No file dist/$file for $line" >&2; ls -R dist >&2 || true; exit 1; }
            node releases/scripts/release-signing.mjs sign "dist/$file"
          done <<< "$FILES"

      # A draft first, made public before the release file names it, so no
      # app is sent to a file that is not there yet. Not marked latest: every
      # app shares this repository's releases.
      - name: Publish the release
        if: inputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.releases_token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$APP-v$VERSION"
          files=()
          while IFS= read -r line; do
            [[ -z "${line//[[:space:]]/}" ]] && continue
            files+=("dist/${line#*=}")
          done <<< "$FILES"
          while IFS= read -r file; do
            [[ -z "${file//[[:space:]]/}" ]] && continue
            [[ "$file" =~ ^[A-Za-z0-9._-]+$ && -f "dist/$file" ]] || { echo "No file dist/$file to attach" >&2; exit 1; }
            files+=("dist/$file")
          done <<< "$ATTACH"
          notes="${NOTES:-$APP $VERSION}"
          gh release create "$tag" --repo "$RELEASES" --target main --draft --latest=false \
            --title "$APP $VERSION" --notes "$notes" "${files[@]}"
          gh release edit "$tag" --repo "$RELEASES" --draft=false --latest=false

      - name: Write the release file
        shell: bash
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --out "releases/apps/$APP/$CHANNEL.json" --merge
            --base-url "https://github.com/$RELEASES/releases/download/$APP-v$VERSION")
          while IFS= read -r line; do
            [[ -z "${line//[[:space:]]/}" ]] && continue
            args+=("${line%%=*}=dist/${line#*=}")
          done <<< "$FILES"
          while IFS= read -r line; do
            [[ -z "${line//[[:space:]]/}" ]] && continue
            args+=(--store "$line")
          done <<< "$STORES"
          if [[ -n "$NOTES" ]]; then
            printf '%s\n' "$NOTES" > notes.md
            args+=(--notes-file notes.md)
          fi
          node releases/scripts/release-manifest.mjs "${args[@]}"

      # Apps publish into one branch, so another may have pushed meanwhile.
      - name: Push the release file
        shell: bash
        run: |
          set -euo pipefail
          cd releases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/$CHANNEL.json"
          # A rerun of the same release writes the same file.
          git diff --cached --quiet && exit 0
          git commit -m "release($APP): $VERSION on $CHANNEL"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push the release file after five attempts" >&2
          exit 1
